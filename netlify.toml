[build]
  publish = "foodieexpress_frontend"
  command = "echo 'No build step required — static site'"

[dev]
  command = "npx live-server --port=5500 --open=foodieexpress_frontend/index.html --host=localhost"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"