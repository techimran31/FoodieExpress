<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FoodieExpress — Test Runner</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><style>
  .test-pass { color: #198754; }
  .test-fail { color: #dc3545; }
  .test-suite { font-weight: 700; margin-top: 1.5rem; border-top: 2px solid #dee2e6; padding-top: 1rem; }
  .test-case { padding: 0.5rem 0; border-bottom: 1px solid #f8f9fa; }
  .progress-bar { height: 8px; }
</style></head><body>
<nav class="navbar navbar-expand-lg sticky-top shadow-sm"><div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark"><i class="bi bi-egg-fried"></i></span><span class="brand-name">Foodie<span class="text-brand">Express</span></span></a><a href="index.html" class="btn btn-sm btn-brand ms-auto">&larr; Back to site</a></div></nav>

<div class="container py-5">
  <h1 class="h3 fw-bold mb-4">JavaScript Unit Tests</h1>
  <div class="alert alert-info"><i class="bi bi-info-circle me-2"></i>Browser-based test runner. Tests run directly in the browser without Node.js.</div>
  
  <div class="progress mb-3"><div id="progressBar" class="progress-bar bg-success" style="width:0%"></div></div>
  <div class="d-flex justify-content-between mb-3"><span id="testSummary">0 tests</span><span class="badge bg-dark" id="passCount">0 passed</span></div>

  <div id="testOutput"></div>
</div>

<script>
  // Minimal test framework for browser
  const results = { pass: 0, fail: 0, total: 0, suites: [] };
  const outputEl = document.getElementById('testOutput');
  const progressEl = document.getElementById('progressBar');
  const summaryEl = document.getElementById('testSummary');
  const passCountEl = document.getElementById('passCount');

  function describe(name, fn) {
    const suite = { name, tests: [] };
    results.suites.push(suite);
    
    const suiteEl = document.createElement('div');
    suiteEl.className = 'card mb-3';
    suiteEl.innerHTML = `<div class="card-header"><h6 class="mb-0">${name}</h6></div><div class="card-body" id="suite-${results.suites.length-1}"></div>`;
    outputEl.appendChild(suiteEl);
    
    const suiteBody = document.getElementById(`suite-${results.suites.length-1}`);
    fn({
      it: (testName, testFn) => {
        const testEl = document.createElement('div');
        testEl.className = 'test-case';
        testEl.innerHTML = `<span class="test-name">${testName}</span> <span class="status">...</span>`;
        suiteBody.appendChild(testEl);
        
        results.total++;
        updateProgress();
        
        try {
          testFn();
          results.pass++;
          testEl.querySelector('.status').textContent = '✓ PASS';
          testEl.querySelector('.status').className = 'status test-pass';
        } catch (err) {
          results.fail++;
          testEl.querySelector('.status').textContent = `✗ FAIL: ${err.message}`;
          testEl.querySelector('.status').className = 'status test-fail';
        }
        updateProgress();
      }
    });
  }

  function expect(actual) {
    return {
      toBe(expected) {
        if (actual !== expected) throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
      },
      toBeNull() {
        if (actual !== null) throw new Error(`Expected null but got ${JSON.stringify(actual)}`);
      },
      toBeUndefined() {
        if (actual !== undefined) throw new Error(`Expected undefined but got ${JSON.stringify(actual)}`);
      },
      toBeTrue() {
        if (actual !== true) throw new Error(`Expected true but got ${JSON.stringify(actual)}`);
      },
      toBeFalse() {
        if (actual !== false) throw new Error(`Expected false but got ${JSON.stringify(actual)}`);
      },
      toMatch(pattern) {
        if (!new RegExp(pattern).test(String(actual))) throw new Error(`Expected ${actual} to match ${pattern}`);
      },
      toBeDefined() {
        if (actual === undefined) throw new Error('Expected value to be defined');
      },
      toBeGreaterThan(n) {
        if (!(actual > n)) throw new Error(`Expected ${actual} to be greater than ${n}`);
      },
      rejects: {
        async toThrow(msg) {
          try {
            await actual;
          } catch (err) {
            if (msg && !err.message.includes(msg)) throw new Error(`Expected error to include "${msg}" but got "${err.message}"`);
            return;
          }
          throw new Error('Expected promise to reject but it resolved');
        }
      }
    };
  }

  async function updateProgress() {
    const pct = results.total > 0 ? Math.round((results.pass / results.total) * 100) : 0;
    progressEl.style.width = `${pct}%`;
    summaryEl.textContent = `${results.total} tests`;
    passCountEl.textContent = `${results.pass} passed${results.fail > 0 ? `, ${results.fail} failed` : ''}`;
    passCountEl.className = `badge ${results.fail > 0 ? 'bg-danger' : 'bg-success'}`;
  }

  // Mock localStorage
  const localStorageMock = (() => {
    let store = {};
    return {
      getItem: (key) => store[key] || null,
      setItem: (key, value) => { store[key] = value; },
      removeItem: (key) => { delete store[key]; },
      clear: () => { store = {}; },
    };
  })();
  Object.defineProperty(window, 'localStorage', { value: localStorageMock });

  // Mock document.querySelectorAll
  document.querySelectorAll = () => [];
  window.dispatchEvent = () => true;

  // Import test modules
  async function runTests() {
    const modules = [
      './tests/money.test.js',
      './tests/cart.test.js',
      './tests/order.test.js',
      './tests/auth.test.js',
    ];
    for (const mod of modules) {
      await import(mod);
    }
  }

  runTests().catch(console.error);
</script>
</body></html>
